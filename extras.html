<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111814" />
    <meta name="description" content="Citywide team badges for Claim Chicago." />
    <title>Badges · Claim Chicago</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="loop-shell">
      <header class="topbar loop-topbar">
        <a class="brand" href="index.html" aria-label="Return to Claim Chicago"><span class="brand-mark">C</span><span><b>Claim Chicago</b><small>Neighborhood territory map</small></span></a>
        <p class="loop-nav-label">Badges</p>
        <a class="button ghost" href="index.html">Neighborhood map</a>
      </header>
      <section class="loop-workspace">
        <aside class="loop-panel extra-panel">
          <p class="eyebrow">Citywide badge board</p>
          <h1>Earn your<br />badges.</h1>
          <p class="loop-intro">Complete challenges as a team. The Top to Bottom record can be claimed—or stolen—by another team.</p>
          <fieldset class="loop-team-picker"><legend>Choose your team</legend><div class="team-options"><button class="team-choice team-1" type="button" data-team="Team 1"><i></i>Team 1</button><button class="team-choice team-2" type="button" data-team="Team 2"><i></i>Team 2</button><button class="team-choice team-3" type="button" data-team="Team 3"><i></i>Team 3</button></div></fieldset>
          <p id="extraConnection" class="loop-connection">Loading challenges…</p>
          <div id="extraList" class="task-list" aria-live="polite"></div>
        </aside>
        <div id="extraMap" class="loop-map" aria-label="Map of extra Chicago challenges"></div>
      </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="firebase-config.js"></script>
    <script type="module" src="extras.js"></script>
  </body>
</html>
